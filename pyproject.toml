# Notes:
# 1. Primary dependency declarations live in pyproject.toml.
# 2. Runtime resolution is pinned by uv.lock for reproducible installs.
[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "moneyprinterturbo"
version = "2.1.0"
description = "Generate short videos from prompts, local assets, subtitles, and TTS."
readme = "README-en.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
    "moviepy==2.2.1",
    "streamlit==1.58.0",
    "edge-tts==7.2.7",
    "fastapi==0.136.3",
    "uvicorn==0.32.1",
    "openai==2.24.0",
    "faster-whisper==1.1.0",
    "loguru==0.7.3",
    "google-generativeai==0.8.6",
    "google-genai==2.10.0",
    "dashscope==1.20.14",
    "azure-cognitiveservices-speech==1.41.1",
    "redis==5.2.0",
    "python-multipart==0.0.27",
    "pyyaml==6.0.3",
    "requests==2.33.1",
    "socksio==1.0.0",
    "pydub==0.25.1",
    "litellm==1.86.2",
]

[project.optional-dependencies]
g4f = [
    "g4f==0.5.2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# This project is primarily an application, not an installable Python package.
package = false
